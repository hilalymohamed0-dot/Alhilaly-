<title>معهد الهلالي</title>
<style>
:root{--bg:#fefaf5;--card:#fff;--tx:#173231;--mu:#66807e;--bd:#e8e1d3;--pr:#1a8a8a;--gold:#d3a843;--ok:#1f9d63;--no:#d64545;--late:#d98a1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1c1c;--card:#152827;--tx:#eaf5f4;--mu:#9bb5b3;--bd:#274241;--pr:#3bb8b8;--gold:#e0b657;--ok:#43c88a;--no:#ef6b6b;--late:#f0a949;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1c1c;--card:#152827;--tx:#eaf5f4;--mu:#9bb5b3;--bd:#274241;--pr:#3bb8b8;--gold:#e0b657;--ok:#43c88a;--no:#ef6b6b;--late:#f0a949;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
  <div class="row" style="margin-bottom:14px">
  <a class="btn" style="flex:1;text-align:center;text-decoration:none" href="tasi3.html">التاسع</a>
  <a class="btn" style="flex:1;text-align:center;text-decoration:none" href="bakaloria.html">بكالوريا</a>
</div>
h1{font-size:20px;margin:4px 0 14px}
nav{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:14px}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--pr);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:10px;width:100%;min-width:0}
.btn{border:0;background:var(--pr);color:#fff;font:inherit;font-weight:600;padding:10px 16px;border-radius:9px;cursor:pointer;white-space:nowrap}
.x{background:none;color:var(--no);padding:6px 10px;border:1px solid var(--bd)}
.name{flex:1;font-weight:600}.sub{color:var(--mu);font-size:13px;font-weight:400}
.st{display:flex;gap:4px}
.st button{border:1px solid var(--bd);background:var(--bg);color:var(--mu);font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;cursor:pointer}
.st .p.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.st .a.on{background:var(--no);color:#fff;border-color:var(--no)}
.st .l.on{background:var(--late);color:#fff;border-color:var(--late)}
.sum{display:flex;gap:8px;margin-bottom:10px}
.sum div{flex:1;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:13px;color:var(--mu)}
.sum b{display:block;font-size:22px;color:var(--tx)}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.brand{display:flex;align-items:center;gap:12px;padding:6px 0 12px;margin-bottom:14px;border-bottom:3px solid var(--gold)}.brand img{width:64px;height:auto}.brand h1{margin:0;font-size:22px;color:var(--pr)}.brand span{color:var(--mu);font-size:14px}
</style>
</head>

<script>
var S={students:[],att:{}},tab='students',day=new Date().toISOString().slice(0,10);
function load(){try{var d=localStorage.getItem('inst');if(d){var o=JSON.parse(d);if(o&&o.students)S=o}}catch(e){}}
function save(){try{localStorage.setItem('inst',JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){
document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});
var v=document.getElementById('view'),h='';
if(tab==='students'){
h+='<div class="card"><div class="row"><input id="n" placeholder="اسم الطالب"><input id="g" placeholder="الصف / الدورة"></div><div class="row" style="margin-top:8px"><button class="btn" style="width:100%" onclick="add()">إضافة طالب</button></div></div>';
if(!S.students.length)h+='<div class="empty">لا يوجد طلاب بعد. أضف أول طالب.</div>';
S.students.forEach(function(s){h+='<div class="card row"><div class="name">'+esc(s.name)+'<div class="sub">'+esc(s.g||'')+'</div></div><button class="btn x" onclick="del('+s.id+')">حذف</button></div>'});
}else if(tab==='attend'){
var r=S.att[day]||{},c={p:0,a:0,l:0};
S.students.forEach(function(s){if(r[s.id])c[r[s.id]]++});
h+='<div class="card"><input type="date" id="d" value="'+day+'" onchange="day=this.value;render()"></div>';
h+='<div class="sum"><div><b>'+c.p+'</b>حاضر</div><div><b>'+c.a+'</b>غائب</div><div><b>'+c.l+'</b>متأخر</div></div>';
if(!S.students.length)h+='<div class="empty">أضف طلاباً أولاً من تبويب الطلاب.</div>';
S.students.forEach(function(s){var t=r[s.id];
h+='<div class="card row"><div class="name">'+esc(s.name)+'</div><div class="st">'+
['p:حاضر','a:غائب','l:متأخر'].map(function(x){var k=x[0];return'<button class="'+k+(t===k?' on':'')+'" onclick="mark('+s.id+',\''+k+'\')">'+x.slice(2)+'</button>'}).join('')+'</div></div>'});
}else{
if(!S.students.length)h+='<div class="empty">لا توجد بيانات بعد.</div>';
var days=Object.keys(S.att);
S.students.forEach(function(s){var p=0,a=0,l=0;
days.forEach(function(d){var t=S.att[d][s.id];if(t==='p')p++;else if(t==='a')a++;else if(t==='l')l++});
var tot=p+a+l,pct=tot?Math.round((p+l)/tot*100):0;
h+='<div class="card"><div class="row"><div class="name">'+esc(s.name)+'</div><b>'+pct+'%</b></div><div class="sub">حضور: '+p+' · غياب: '+a+' · تأخر: '+l+'</div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'});
}
v.innerHTML=h;}
function add(){var n=document.getElementById('n').value.trim();if(!n)return;
S.students.push({id:Date.now(),name:n,g:document.getElementById('g').value.trim()});save();render()}
function del(id){if(!confirm('حذف هذا الطالب؟'))return;
S.students=S.students.filter(function(s){return s.id!==id});
for(var d in S.att)delete S.att[d][id];save();render()}
function mark(id,k){S.att[day]=S.att[day]||{};S.att[day][id]=S.att[day][id]===k?undefined:k;save();render()}
document.getElementById('nav').onclick=function(e){if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
